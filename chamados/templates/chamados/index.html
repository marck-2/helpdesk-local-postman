{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HelpDesk Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'chamados/style.css' %}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--brand)"/>
        <path d="M9 11.5h14a1.5 1.5 0 0 1 1.5 1.5v1.2a2.3 2.3 0 0 0 0 4.6V19a1.5 1.5 0 0 1-1.5 1.5H9A1.5 1.5 0 0 1 7.5 19v-1.2a2.3 2.3 0 0 0 0-4.6V13A1.5 1.5 0 0 1 9 11.5Z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M17.5 12v8" stroke="#fff" stroke-width="1.8" stroke-dasharray="1.6 2.2"/>
      </svg>
      <div>
        <h1>HelpDesk Local</h1>
        <p>Chamados de suporte</p>
      </div>
    </div>

    <label class="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="busca" type="search" placeholder="Buscar por título ou descrição" autocomplete="off" aria-label="Buscar chamados">
    </label>

    <div class="actions">
      <button class="btn ghost" id="btn-api" type="button">API</button>
      <button class="btn primary" id="btn-novo" type="button">Novo chamado</button>
    </div>
  </header>

  <main>
    <section class="overview" aria-label="Resumo dos chamados">
      <div class="overview-head">
        <div>
          <h2><span id="total">0</span> chamados</h2>
          <p id="subtitulo">Arraste um cartão para outra coluna para mudar o status.</p>
        </div>
        <div class="filters" role="group" aria-label="Filtrar por prioridade">
          <button class="chip is-on" data-prioridade="" type="button">Todas</button>
          <button class="chip" data-prioridade="Alta" type="button">Alta</button>
          <button class="chip" data-prioridade="Média" type="button">Média</button>
          <button class="chip" data-prioridade="Baixa" type="button">Baixa</button>
        </div>
      </div>
      <div class="meter" id="meter" role="img" aria-label="Distribuição dos chamados por status"></div>
      <ul class="legend" id="legend"></ul>
    </section>

    <section class="board" id="board" aria-label="Quadro de chamados"></section>
  </main>

  <!-- Formulário -->
  <dialog id="dlg-form" class="drawer">
    <form id="form" method="dialog" novalidate>
      <header>
        <h2 id="form-titulo">Novo chamado</h2>
        <button class="icon-btn" type="button" data-close aria-label="Fechar">×</button>
      </header>

      <div class="field">
        <label for="f-titulo">Título</label>
        <input id="f-titulo" name="titulo" maxlength="150" required placeholder="Ex.: Impressora do 2º andar não imprime">
        <small class="err" data-err="titulo"></small>
      </div>

      <div class="field">
        <label for="f-descricao">Descrição</label>
        <textarea id="f-descricao" name="descricao" rows="5" required placeholder="O que aconteceu, onde e desde quando?"></textarea>
        <small class="err" data-err="descricao"></small>
      </div>

      <div class="row">
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status" name="status">
            <option>Aberto</option>
            <option>Em andamento</option>
            <option>Pendente</option>
            <option>Resolvido</option>
          </select>
        </div>
        <div class="field">
          <label for="f-prioridade">Prioridade</label>
          <select id="f-prioridade" name="prioridade">
            <option>Baixa</option>
            <option selected>Média</option>
            <option>Alta</option>
          </select>
        </div>
      </div>

      <footer>
        <button class="btn ghost" type="button" data-close>Cancelar</button>
        <button class="btn primary" type="submit" id="btn-salvar">Criar chamado</button>
      </footer>
    </form>
  </dialog>

  <!-- Painel da API -->
  <dialog id="dlg-api" class="drawer wide">
    <header>
      <h2>Endpoints da API</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fechar">×</button>
    </header>
    <p class="hint">Use estes endpoints no Postman. Base: <code id="api-base"></code></p>
    <ul class="endpoints" id="endpoints"></ul>
    <h3>Exemplo de corpo (JSON)</h3>
    <pre id="exemplo"></pre>
    <button class="btn ghost" type="button" id="copiar-exemplo">Copiar JSON</button>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="{% static 'chamados/app.js' %}"></script>
</body>
</html>
